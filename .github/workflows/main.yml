name: Daily Job Fetcher
on:
  schedule:
    - cron: '0 9 * * *' 
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Python Script
        run: python update_jobs.py

      - name: Save new jobs to repository
        run: |
          git config --global user.name "Job Bot"
          git config --global user.email "actions@github.com"
          git add jobs.json
          git commit -m "Daily job update" || echo "No changes to commit"
          git push
